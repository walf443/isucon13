name: go

on:
  push:
    paths:
      - "webapp/go/**"
      - "webapp/sql/initdb.d/**"
      - ".github/workflows/go.yml"
  pull_request:
    paths:
      - "webapp/go/**"
      - "webapp/sql/initdb.d/**"
      - ".github/workflows/go.yml"

jobs:
  check:
    name: go ${{ matrix.command }}
    runs-on: ubuntu-latest
    strategy:
      # どれか 1 つが落ちても、残りの結果も最後まで見られるようにする
      fail-fast: false
      matrix:
        include:
          - command: build
          - command: vet
          # infra/mysql のテストは testcontainers で MySQL コンテナを起動する (ubuntu-latest には Docker がある)
          - command: test
            args: -v
    defaults:
      run:
        working-directory: webapp/go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: webapp/go/go.mod
          cache-dependency-path: webapp/go/go.sum
      - run: go ${{ matrix.command }} ${{ matrix.args }} ./...
