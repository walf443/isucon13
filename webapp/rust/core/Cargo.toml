[package]
name = "isupipe-core"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
test = ["ctor", "mockall", "testcontainers", "testcontainers-modules"]

[dependencies]
async-trait.workspace = true
bcrypt.workspace = true
chrono.workspace = true
kubetsu.workspace = true
fake.workspace = true
ctor = { version = "0.4", optional = true }
mockall = { version = "0.13", optional = true }
testcontainers = { version = "0.27", optional = true }
testcontainers-modules = { version = "0.15", features = ["mysql"], optional = true }
num-traits.workspace = true
serde.workspace = true
sqlx.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing = "0.1"
